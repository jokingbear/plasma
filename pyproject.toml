[project]
name = "plasma"
version= "4.34.9dev0"
requires-python = ">=3.14"
dependencies = [
    'numpy',
    'pandas',
    'scipy',
    'tqdm',
    'networkx',
    'pyyaml',
    'setuptools',
    'huggingface_hub',
    'rich',
    'pyzmq',
    'intervaltree',
    'zarr'
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plasma"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint]
ignore = ["I001"]
